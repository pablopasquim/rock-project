<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rock Finance — Plataforma Fintech com Inteligência Artificial para gestão financeira." />
  <title>Rock Finance — Finanças Pessoais com IA</title>

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Styles -->
  <link rel="stylesheet" href="/static/index.css" />

  <!-- Dependências Externas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
</head>
<body>

  <!-- Tela de Login -->
  <div id="login-screen" class="modal-overlay" style="display: flex; background: var(--navy-950);">
    <div class="modal-content" style="max-width: 420px; border: 1px solid var(--navy-700); background: var(--navy-900); color: #ffffff;">
      <div style="text-align: center; margin-bottom: 28px;">
        <img src="/static/image/logo2.png" alt="Rock Finance Logo" class="login-logo-img" style="width: 220px; max-width: 85%; height: auto; object-fit: contain; margin-bottom: 12px; filter: drop-shadow(0 8px 32px rgba(67,97,238,0.6));" />
        <p style="font-size: 0.95rem; color: var(--navy-300); margin-top: 8px;">Entre na sua plataforma financeira</p>
      </div>

      <div id="login-error-msg" style="display: none; padding: 12px; border-radius: var(--r-sm); background: rgba(244,63,94,0.15); border: 1px solid var(--expense); color: #ffb4c2; font-size: 0.85rem; margin-bottom: 16px;"></div>

      <form id="login-form" style="display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 0.82rem; font-weight: 600; color: var(--navy-300);" for="login-email">E-mail</label>
          <input style="padding: 12px 16px; border-radius: var(--r-sm); border: 1px solid var(--navy-600); background: var(--navy-950); color: #ffffff; outline: none;" type="email" id="login-email" placeholder="seu@email.com" required autocomplete="email" />
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 0.82rem; font-weight: 600; color: var(--navy-300);" for="login-password">Senha</label>
          <input style="padding: 12px 16px; border-radius: var(--r-sm); border: 1px solid var(--navy-600); background: var(--navy-950); color: #ffffff; outline: none;" type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary-cockpit" id="login-btn" style="justify-content: center; width: 100%; margin-top: 8px;">
          <i data-lucide="log-in" style="width:18px;height:18px;"></i>
          Entrar
        </button>
      </form>
    </div>
  </div>

  <!-- Aplicação Principal -->
  <div id="app" style="display: none;">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img src="/static/image/logo2.png" alt="Rock Finance Logo" class="sidebar-logo-img" />
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="dashboard" id="nav-dashboard" href="#">
          <i data-lucide="layout-dashboard"></i>
          Dashboard
        </a>
        <a class="nav-item" data-page="transactions" id="nav-transactions" href="#">
          <i data-lucide="arrow-left-right"></i>
          Transações
        </a>
        <a class="nav-item" data-page="history" id="nav-history" href="#">
          <i data-lucide="calendar-days"></i>
          Histórico
        </a>
        <a class="nav-item" data-page="chat" id="nav-chat" href="#">
          <i data-lucide="bot"></i>
          Rock Advisor
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-badge">
          <div class="user-avatar" id="user-avatar-initials">RF</div>
          <div class="user-info">
            <span class="user-email" id="user-email-display">usuario@email.com</span>
            <span id="dev-bypass-badge" style="display:none;font-size:0.7rem;color:var(--purple-300);">Dev Bypass</span>
          </div>
          <button class="topbar-btn" id="btn-logout" title="Sair / Logout" style="width:28px;height:28px;margin-left:auto;border:none;background:transparent;color:#a78bfa;">
            <i data-lucide="log-out" style="width:16px;height:16px;"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <header class="topbar">
        <div>
          <h1 class="topbar-title" id="page-title">Dashboard</h1>
          <span class="topbar-subtitle" id="page-subtitle">Visão geral financeira</span>
        </div>

        <div class="topbar-actions">
          <div class="month-selector-wrapper">
            <i data-lucide="calendar" style="width:16px;height:16px;color:var(--text-muted);"></i>
            <select id="global-month-select" aria-label="Selecionar mês"></select>
          </div>

          <button class="topbar-btn" id="theme-toggle" aria-label="Alternar Tema" title="Alternar Tema">
            <i data-lucide="moon" style="width:18px;height:18px;"></i>
          </button>

          <button class="btn-primary-cockpit" id="btn-add-transaction">
            <i data-lucide="plus" style="width:18px;height:18px;"></i>
            <span>Nova Transação</span>
          </button>
        </div>
      </header>

      <main class="app-content" id="page-content">
        <div class="loader"><div class="spinner"></div></div>
      </main>
    </div>

    <!-- Bottom Navigation Mobile Inspirado na Imagem -->
    <nav class="mobile-nav">
      <a class="mobile-nav-item active" data-page="dashboard" href="#">
        <i data-lucide="layout-dashboard" style="width:22px;height:22px;"></i>
        <span>Home</span>
      </a>
      <a class="mobile-nav-item" data-page="transactions" href="#">
        <i data-lucide="arrow-left-right" style="width:22px;height:22px;"></i>
        <span>Extrato</span>
      </a>
      <button class="mobile-fab" id="btn-mobile-fab" title="Nova Transação">
        <i data-lucide="plus" style="width:26px;height:26px;"></i>
      </button>
      <a class="mobile-nav-item" data-page="history" href="#">
        <i data-lucide="calendar-days" style="width:22px;height:22px;"></i>
        <span>Histórico</span>
      </a>
      <a class="mobile-nav-item" data-page="chat" href="#">
        <i data-lucide="bot" style="width:22px;height:22px;"></i>
        <span>Advisor</span>
      </a>
    </nav>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Transaction Modal -->
  <div class="modal-overlay" id="transaction-modal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Nova Transação</h2>
        <button class="modal-close-btn" id="modal-close-btn" aria-label="Fechar">
          <i data-lucide="x" style="width:18px;height:18px;"></i>
        </button>
      </div>

      <form id="transaction-form">

        <!-- Type Toggle -->
        <div class="type-toggle">
          <button type="button" class="type-btn active expense" id="btn-type-expense">
            <i data-lucide="trending-down" style="width:16px;height:16px;"></i>
            Despesa
          </button>
          <button type="button" class="type-btn income" id="btn-type-income">
            <i data-lucide="trending-up" style="width:16px;height:16px;"></i>
            Receita
          </button>
        </div>

        <!-- Valor + Data -->
        <div class="form-row">
          <div class="form-field">
            <label class="form-label" for="tx-amount">Valor (R$)</label>
            <input class="modal-input" type="number" id="tx-amount" step="0.01" min="0.01" placeholder="0,00" required />
          </div>
          <div class="form-field">
            <label class="form-label" for="tx-date">Data</label>
            <input class="modal-input" type="date" id="tx-date" required />
          </div>
        </div>

        <!-- Parcelamento -->
        <div class="installment-row" id="installments-row">
          <label class="installment-check-label">
            <input type="checkbox" id="tx-is-installment" class="installment-check" />
            <span>Despesa parcelada?</span>
          </label>
          <div id="installments-qty-group" style="visibility:hidden;flex:1;">
            <select class="modal-input" id="tx-installments" style="width:100%;"></select>
          </div>
        </div>

        <!-- Descrição -->
        <div class="form-field">
          <label class="form-label" for="tx-description">Descrição</label>
          <input class="modal-input" type="text" id="tx-description" placeholder="Ex: Supermercado, Salário..." required maxlength="200" />
        </div>

        <!-- Categoria -->
        <div class="form-field">
          <label class="form-label">Categoria</label>
          <div class="category-grid" id="category-grid"></div>
          <input type="hidden" id="tx-category" required />
        </div>

        <!-- Actions -->
        <div class="modal-actions">
          <button type="button" class="modal-btn-cancel" id="btn-cancel-modal">Cancelar</button>
          <button type="submit" class="modal-btn-save" id="submit-btn">
            <i data-lucide="check" style="width:16px;height:16px;"></i>
            Salvar
          </button>
        </div>

      </form>
    </div>
  </div>


  <!-- Scripts -->
  <script src="/static/auth.js"></script>
  <script src="/static/modules/dashboard.js"></script>
  <script src="/static/modules/transactions.js"></script>
  <script src="/static/modules/history.js"></script>
  <script src="/static/modules/chat.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
