<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rock Finance — Gerencie suas finanças pessoais com inteligência artificial. Rastreie gastos, visualize tendências e converse com o Rock Advisor." />
  <title>Rock Finance — Finanças Pessoais com IA</title>

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Styles -->
  <link rel="stylesheet" href="/static/index.css" />

  <!-- Dependências Externas (Versões Estáveis Fixadas) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
</head>
<body>

  <!-- Tela de Login Acessível (Inicialmente visível se não autenticado) -->
  <div id="login-screen" class="login-overlay" style="display: flex;">
    <div class="login-card">
      <div class="login-header">
        <img src="/static/image/logo2.png" alt="Rock Finance Logo" class="login-logo" />
        <h1 class="login-title">Rock Finance</h1>
        <p class="login-subtitle">Entre para acessar suas finanças familiares</p>
      </div>

      <div id="login-error-msg" class="login-error-alert" role="alert" aria-live="polite" style="display: none;"></div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">E-mail</label>
          <input class="form-input" type="email" id="login-email" placeholder="seu@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Senha</label>
          <input class="form-input" type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">
          <i data-lucide="log-in" style="width:16px;height:16px;"></i>
          Entrar
        </button>
      </form>
    </div>
  </div>

  <!-- Aplicação Principal (Visível quando autenticado) -->
  <div id="app" style="display: none;">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <img src="/static/image/logo2.png" alt="Rock Finance Logo" class="adaptive-logo" />
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="dashboard" id="nav-dashboard" href="#">
          <i data-lucide="layout-dashboard" class="nav-icon"></i>
          Dashboard
        </a>
        <a class="nav-item" data-page="transactions" id="nav-transactions" href="#">
          <i data-lucide="arrow-left-right" class="nav-icon"></i>
          Transações
        </a>
        <a class="nav-item" data-page="history" id="nav-history" href="#">
          <i data-lucide="calendar-days" class="nav-icon"></i>
          Histórico
        </a>
        <a class="nav-item" data-page="chat" id="nav-chat" href="#">
          <i data-lucide="bot" class="nav-icon"></i>
          Rock Advisor
        </a>
      </nav>

      <div class="sidebar-footer">
        <!-- Indicador de Usuário e Logout -->
        <div class="user-profile-bar" style="margin-bottom:12px;padding:8px 10px;background:var(--bg-glass);border-radius:var(--r-md);display:flex;align-items:center;justify-content:space-between;gap:6px;">
          <div style="min-width:0;flex:1;">
            <div id="user-email-display" style="font-size:11px;font-weight:600;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
            <span id="dev-bypass-badge" class="badge neutral" style="display:none;font-size:9px;padding:2px 6px;margin-top:2px;">Dev Bypass</span>
          </div>
          <button class="btn-icon" id="btn-logout" title="Sair / Logout" aria-label="Sair da conta" style="width:30px;height:30px;flex-shrink:0;">
            <i data-lucide="log-out" style="width:14px;height:14px;"></i>
          </button>
        </div>

        <div class="month-selector">
          <i data-lucide="calendar" style="width:14px;height:14px;flex-shrink:0;"></i>
          <select id="global-month-select" aria-label="Selecionar mês"></select>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <!-- Top Bar -->
      <header class="topbar">
        <div>
          <div class="page-title" id="page-title">Dashboard</div>
          <div class="page-subtitle" id="page-subtitle">Visão geral do seu mês</div>
        </div>
        <div class="topbar-actions">
          <button class="btn-icon" id="theme-toggle" aria-label="Alternar Tema">
            <i data-lucide="moon"></i>
          </button>
          <button class="btn btn-primary" id="btn-add-transaction">
            <i data-lucide="plus" style="width:16px;height:16px;"></i>
            <span class="btn-text">Nova Transação</span>
          </button>
        </div>
      </header>

      <!-- Dynamic Page Content -->
      <main class="content" id="page-content">
        <div class="loader"><div class="spinner"></div></div>
      </main>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Transaction Modal Acessível -->
  <div class="modal-overlay" id="transaction-modal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Nova Transação</h2>
        <button class="btn-icon" id="modal-close-btn" aria-label="Fechar">
          <i data-lucide="x" style="width:18px;height:18px;"></i>
        </button>
      </div>

      <form id="transaction-form" class="form-grid">
        <!-- Type Toggle -->
        <div class="form-group">
          <label class="form-label">Tipo</label>
          <div class="type-toggle">
            <button type="button" class="type-btn active expense" id="btn-type-expense">
              <i data-lucide="trending-down" style="width:14px;height:14px;"></i>
              Despesa
            </button>
            <button type="button" class="type-btn income" id="btn-type-income">
              <i data-lucide="trending-up" style="width:14px;height:14px;"></i>
              Receita
            </button>
          </div>
        </div>

        <!-- Amount & Date -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="tx-amount">Valor (R$)</label>
            <input class="form-input" type="number" id="tx-amount" step="0.01" min="0.01" placeholder="0,00" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="tx-date">Data</label>
            <input class="form-input" type="date" id="tx-date" required />
          </div>
        </div>

        <!-- Installments -->
        <div class="form-row" id="installments-row">
          <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px; justify-content: flex-start; height: 100%; padding-top: 10px;">
            <input type="checkbox" id="tx-is-installment" style="width:18px;height:18px;cursor:pointer;" />
            <label class="form-label" for="tx-is-installment" style="margin-bottom:0; cursor:pointer;">Parcelada?</label>
          </div>
          <div class="form-group" id="installments-qty-group" style="visibility: hidden;">
            <label class="form-label" for="tx-installments">Opções de Parcelamento</label>
            <select class="form-input" id="tx-installments" style="cursor: pointer;">
              <!-- Options populated by JS -->
            </select>
          </div>
        </div>

        <!-- Description -->
        <div class="form-group">
          <label class="form-label" for="tx-description">Descrição</label>
          <input class="form-input" type="text" id="tx-description" placeholder="Ex: Supermercado, Salário..." required maxlength="200" />
        </div>

        <!-- Category -->
        <div class="form-group">
          <label class="form-label">Categoria</label>
          <div class="category-grid" id="category-grid"></div>
          <input type="hidden" id="tx-category" required />
        </div>

        <!-- Submit -->
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:8px;">
          <button type="button" class="btn btn-secondary" id="btn-cancel-modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="submit-btn">
            <i data-lucide="check" style="width:16px;height:16px;"></i>
            Salvar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/static/auth.js"></script>
  <script src="/static/modules/dashboard.js"></script>
  <script src="/static/modules/transactions.js"></script>
  <script src="/static/modules/history.js"></script>
  <script src="/static/modules/chat.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
