<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rock Finance — Gerencie suas finanças pessoais com inteligência artificial. Rastreie gastos, visualize tendências e converse com sua IA financeira pessoal." />
  <title>Rock Finance — Finanças Pessoais com IA</title>

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Styles -->
  <link rel="stylesheet" href="/static/index.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Marked.js (Markdown parser para o chat) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <img src="/static/image/logo2.png" alt="Rock Finance Logo" class="adaptive-logo" />
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="dashboard" id="nav-dashboard" href="#" onclick="return false;">
          <i data-lucide="layout-dashboard" class="nav-icon"></i>
          Dashboard
        </a>
        <a class="nav-item" data-page="transactions" id="nav-transactions" href="#" onclick="return false;">
          <i data-lucide="arrow-left-right" class="nav-icon"></i>
          Transações
        </a>
        <a class="nav-item" data-page="history" id="nav-history" href="#" onclick="return false;">
          <i data-lucide="calendar-days" class="nav-icon"></i>
          Histórico
        </a>
        <a class="nav-item" data-page="chat" id="nav-chat" href="#" onclick="return false;">
          <i data-lucide="bot" class="nav-icon"></i>
          Chat IA
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="month-selector">
          <i data-lucide="calendar" style="width:14px;height:14px;flex-shrink:0;"></i>
          <select id="global-month-select" aria-label="Selecionar mês"></select>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <!-- Top Bar -->
      <header class="topbar">
        <div>
          <div class="page-title" id="page-title">Dashboard</div>
          <div class="page-subtitle" id="page-subtitle">Visão geral do seu mês</div>
        </div>
        <div class="topbar-actions">
          <button class="btn-icon" id="theme-toggle" aria-label="Alternar Tema">
            <i data-lucide="moon"></i>
          </button>
          <button class="btn btn-primary" id="btn-add-transaction" onclick="App.openAddModal()">
            <i data-lucide="plus" style="width:16px;height:16px;"></i>
            <span class="btn-text">Nova Transação</span>
          </button>
        </div>
      </header>

      <!-- Dynamic Page Content -->
      <main class="content" id="page-content">
        <div class="loader"><div class="spinner"></div></div>
      </main>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Transaction Modal -->
  <div class="modal-overlay" id="transaction-modal" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Nova Transação</h2>
        <button class="btn-icon" onclick="App.closeModal()" aria-label="Fechar">
          <i data-lucide="x" style="width:18px;height:18px;"></i>
        </button>
      </div>

      <form id="transaction-form" class="form-grid" onsubmit="App.submitTransaction(event)">
        <!-- Type Toggle -->
        <div class="form-group">
          <label class="form-label">Tipo</label>
          <div class="type-toggle">
            <button type="button" class="type-btn active expense" id="btn-type-expense" onclick="App.setType('expense')">
              <i data-lucide="trending-down" style="width:14px;height:14px;"></i>
              Despesa
            </button>
            <button type="button" class="type-btn income" id="btn-type-income" onclick="App.setType('income')">
              <i data-lucide="trending-up" style="width:14px;height:14px;"></i>
              Receita
            </button>
          </div>
        </div>

        <!-- Amount & Date -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="tx-amount">Valor (R$)</label>
            <input class="form-input" type="number" id="tx-amount" step="0.01" min="0.01" placeholder="0,00" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="tx-date">Data</label>
            <input class="form-input" type="date" id="tx-date" required />
          </div>
        </div>

        <!-- Installments -->
        <div class="form-row" id="installments-row">
          <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px; justify-content: flex-start; height: 100%; padding-top: 10px;">
            <input type="checkbox" id="tx-is-installment" onchange="App.toggleInstallments()" style="width:18px;height:18px;cursor:pointer;" />
            <label class="form-label" for="tx-is-installment" style="margin-bottom:0; cursor:pointer;">Parcelada?</label>
          </div>
          <div class="form-group" id="installments-qty-group" style="visibility: hidden;">
            <label class="form-label" for="tx-installments">Opções de Parcelamento</label>
            <select class="form-input" id="tx-installments" style="cursor: pointer;">
              <!-- Options will be populated by JS -->
            </select>
          </div>
        </div>

        <!-- Description -->
        <div class="form-group">
          <label class="form-label" for="tx-description">Descrição</label>
          <input class="form-input" type="text" id="tx-description" placeholder="Ex: Supermercado, Salário..." required maxlength="200" />
        </div>

        <!-- Category -->
        <div class="form-group">
          <label class="form-label">Categoria</label>
          <div class="category-grid" id="category-grid"></div>
          <input type="hidden" id="tx-category" required />
        </div>

        <!-- Submit -->
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:8px;">
          <button type="button" class="btn btn-secondary" onclick="App.closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="submit-btn">
            <i data-lucide="check" style="width:16px;height:16px;"></i>
            Salvar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/static/modules/dashboard.js"></script>
  <script src="/static/modules/transactions.js"></script>
  <script src="/static/modules/history.js"></script>
  <script src="/static/modules/chat.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
